  <rect x="640" y="530" width="260" height="65" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="2" />
  <text x="770" y="555" text-anchor="middle" fill="#166534" font-size="13" font-weight="bold">PASS</text>
