<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="960" height="60" fill="#991b1b" />
  <text x="480" y="38" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Quality Gate Decision Flow: Simulated Duplicate Debit</text>
  
  <!-- Flow Node 1: Tests Evaluated -->
  <rect x="330" y="90" width="300" height="55" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
  <text x="480" y="115" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="bold">20 Simulated Banking Tests</text>
  <text x="480" y="132" text-anchor="middle" fill="#64748b" font-size="11">REQ-PAY-FT-001 (12 Acceptance Criteria)</text>

  <!-- Arrow -->
  <path d="M 480 145 L 480 175" stroke="#64748b" stroke-width="3" />

  <!-- Flow Node 2: Results -->
  <rect x="300" y="175" width="360" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
